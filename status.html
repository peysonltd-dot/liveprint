<!DOCTYPE html>
<!-- LivePrint Status Check -->
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查詢印製進度</title>
  
  <!-- 載入 Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 自訂動畫與淡入效果 */
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden-view { display: none !important; }
    
    /* 隱藏原生卷軸以美化畫面 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }

    :root {
      --forest-950: #062d24;
      --forest-900: #0b3b2f;
      --forest-800: #145440;
      --forest-200: #b9d2c4;
      --forest-100: #dce9e1;
      --cream: #f6f0e4;
    }
    .event-bg {
      background:
        radial-gradient(circle at 15% 12%, rgba(185, 210, 196, .18), transparent 34%),
        linear-gradient(145deg, var(--forest-950) 0%, var(--forest-900) 48%, var(--forest-800) 100%);
    }
    .event-shell {
      background: rgba(4, 35, 28, .38);
      border-color: rgba(220, 233, 225, .24);
      box-shadow: 0 28px 70px rgba(2, 25, 20, .38);
    }
    .event-header {
      background: rgba(4, 35, 28, .52);
      border-color: rgba(220, 233, 225, .16);
    }
    #frontendView .event-primary {
      background: var(--cream);
      color: var(--forest-900);
      border: 1px solid rgba(255,255,255,.45);
    }
    #frontendView .event-primary:hover { background: #fffaf1; }
    #frontendView input {
      background: rgba(3, 31, 25, .48);
      border-color: rgba(220, 233, 225, .28);
      color: #fff;
    }
    #frontendView input::placeholder { color: rgba(220, 233, 225, .55); }
    #frontendView input:focus {
      border-color: var(--forest-200);
      box-shadow: 0 0 0 2px rgba(185, 210, 196, .28);
    }
  </style>
</head>
<body class="bg-[#eef3ef] font-sans text-gray-800 antialiased overflow-x-hidden">

  <!-- ========================================== -->
  <!-- 載入中畫面 (Loading)                       -->
  <!-- ========================================== -->
  <div id="loadingView" class="min-h-screen flex items-center justify-center bg-[#eef3ef] fixed inset-0 z-[150]">
    <div class="text-[#145440] font-bold text-xl flex flex-col items-center gap-4">
      <i data-lucide="refresh-cw" class="w-8 h-8 animate-spin"></i>
      系統載入中...
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 前台查詢畫面 (Frontend Status View)        -->
  <!-- ========================================== -->
  <div id="frontendView" class="hidden-view min-h-screen flex items-center justify-center text-white event-bg" style="background:radial-gradient(circle at 15% 12%,rgba(185,210,196,.18),transparent 34%),linear-gradient(145deg,#062d24 0%,#0b3b2f 48%,#145440 100%);">
    <div class="event-shell w-full max-w-md h-screen sm:h-[85vh] backdrop-blur-xl border sm:rounded-2xl flex flex-col overflow-hidden relative" style="background:rgba(4,35,28,.38);border-color:rgba(220,233,225,.24);">
      
      <!-- Header -->
      <div class="event-header text-white p-4 flex justify-center items-center shadow-md z-10 border-b">
        <h1 class="text-lg font-bold tracking-widest">現場印製進度查詢</h1>
      </div>

      <div class="flex-1 overflow-y-auto p-6 flex flex-col justify-center relative">
        
        <!-- ================== 查詢進度 ================== -->
        <div id="frontStatus" class="space-y-6 animate-fade-in">
          
          <div class="bg-black/20 p-4 rounded-xl border border-white/20 text-center shadow-inner">
            <p class="text-white/70 text-sm mb-1">目前最新完成序號</p>
            <p id="displayLastCompleted" class="text-3xl font-black text-white drop-shadow-md">--</p>
          </div>

          <div class="flex gap-2">
            <!-- 修改：提示可以輸入手機號碼 -->
            <input type="text" id="searchSeq" placeholder="請輸入手機號碼或 3 碼序號" class="flex-1 p-4 bg-black/20 border border-white/20 text-white rounded-xl focus:ring-2 focus:ring-white focus:border-white focus:outline-none placeholder-white/50 shadow-inner" />
            <button onclick="handleSearch()" class="event-primary px-6 rounded-xl flex items-center justify-center transition shadow-md">
              <i data-lucide="search" class="w-5 h-5"></i>
            </button>
          </div>
          <div id="searchError" class="hidden-view p-3 bg-black/40 border border-red-400 text-red-200 rounded-lg text-sm"></div>
          
          <div id="searchResultCard" class="hidden-view mt-6 bg-black/30 border border-white/20 rounded-2xl shadow-sm overflow-hidden">
             <!-- Javascript 動態插入查詢結果 -->
          </div>
          
        </div>

      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 應用程式邏輯 (Vanilla JS + Firebase Module)-->
  <!-- ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // --- Firebase 設定 (與主程式相同) ---
    const firebaseConfig = {
      apiKey: "AIzaSyBIYEIvocHJ02A4CHQq9jqIcnWuMrg3E2s",
      authDomain: "peysoncustomized.firebaseapp.com",
      projectId: "peysoncustomized",
      storageBucket: "peysoncustomized.firebasestorage.app",
      messagingSenderId: "24334519651",
      appId: "1:24334519651:web:9a4b1e33422b8bf7dc1756",
      measurementId: "G-ZEWFSS2LZK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "liveprint-canvas-event";

    let orders = [];

    // --- 查詢邏輯 ---
    window.handleSearch = () => {
      const searchVal = document.getElementById('searchSeq').value.trim();
      const errBox = document.getElementById('searchError');
      const resultCard = document.getElementById('searchResultCard');
      
      errBox.classList.add('hidden-view'); 
      resultCard.classList.add('hidden-view');
      
      if(!searchVal) return;
      
      // 修改：同時比對序號或是手機號碼
      const order = orders.find(o => o.sequenceId === searchVal || o.phone === searchVal);
      
      if (order) {
        let statusHtml = '';
        if (order.status === '處理中') statusHtml = `<span class="bg-yellow-500/20 text-yellow-200 px-3 py-1 rounded-full text-sm font-medium flex items-center gap-1 border border-yellow-500/50"><i data-lucide="clock" class="w-4 h-4"></i>處理中</span>`;
        if (order.status === '完成') statusHtml = `<span class="bg-green-500/20 text-green-200 px-3 py-1 rounded-full text-sm font-medium flex items-center gap-1 border border-green-500/50"><i data-lucide="check-circle" class="w-4 h-4"></i>完成</span>`;
        if (order.status === '取消') statusHtml = `<span class="bg-red-500/20 text-red-200 px-3 py-1 rounded-full text-sm font-medium flex items-center gap-1 border border-red-500/50"><i data-lucide="x-circle" class="w-4 h-4"></i>取消</span>`;
        
        // 手機號碼隱碼處理
        const maskedPhone = order.phone.replace(/(\d{4})\d{3}(\d{3})/, '$1***$2');
        
        resultCard.innerHTML = `
          <div class="bg-black/40 px-4 py-3 border-b border-white/10 flex justify-between items-center">
            <span class="font-bold text-white drop-shadow-sm">序號 #${order.sequenceId}</span>
            ${statusHtml}
          </div>
          <div class="p-4 space-y-3 text-sm">
            <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-white/70">選擇圖案</span><span class="font-medium text-white">${order.gift || '未紀錄'}</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-white/70">印製文字</span><span class="font-bold text-white drop-shadow-sm">${order.customText || '未紀錄'}</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-white/70">聯絡手機</span><span class="text-white/90">${maskedPhone}</span></div>
            <div class="flex justify-between"><span class="text-white/70">建立時間</span><span class="text-white/60">${order.createdAt}</span></div>
          </div>
        `;
        resultCard.classList.remove('hidden-view'); 
        lucide.createIcons();
      } else {
        errBox.innerText = '找不到符合的訂單，請確認輸入的手機號碼或序號是否正確';
        errBox.classList.remove('hidden-view');
      }
    };

    // 支援按下 Enter 鍵搜尋
    document.getElementById('searchSeq').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        window.handleSearch();
      }
    });

    // --- 系統初始化 ---
    const initApp = async () => {
      try { await signInAnonymously(auth); } catch (error) { console.error("Auth error:", error); }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          document.getElementById('loadingView').classList.add('hidden-view');
          document.getElementById('frontendView').classList.remove('hidden-view');

          // 監聽訂單變化以取得最新完成序號
          onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), (snapshot) => {
            orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

            // 計算目前最新完成的序號
            const completed = orders.filter(o => o.status === '完成');
            document.getElementById('displayLastCompleted').innerText = completed.length > 0
              ? completed.reduce((latest, order) => parseInt(order.sequenceId, 10) > parseInt(latest.sequenceId, 10) ? order : latest).sequenceId
              : '--';
          });
        }
      });
    };

    lucide.createIcons();
    initApp();
  </script>
</body>
</html>
